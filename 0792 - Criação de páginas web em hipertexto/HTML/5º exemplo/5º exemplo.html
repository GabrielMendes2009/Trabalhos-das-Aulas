<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <title> Multimédia e MP3 </title>

    <style>

        body {

            background-color: #F4EBE1; /* Cor de fundo da página */
            color: #2A1E17;
            
            display: flex; /* Usa Flexbox para organizar o layout da página */
            flex-direction: column; /* Organiza os elementos em uma coluna */
            align-items: center; /* Centraliza os elementos horizontalmente */
            text-align: center; /* Centraliza o texto dentro dos elementos */
            padding: 20px; /* Adiciona um espaçamento interno de 20 pixels em toda a página */
            margin: 0; /* Remove a margem padrão do navegador para evitar espaços indesejados ao redor da página */

        }

        h1, h2 {
            color: #4C7864;
        }

        a {
            color: #DA8389; 
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            color: #25182E;
        }

    </style>
</head>

<body>
    <h2> Inserir Vídeo </h2>
    <p> Trailer de The Apothecary Diaries - Opening  Hana ni Natte </p>
    <video src="vids/The Apothecary Diaries - Opening  Hana ni Natte.mp4" controls></video>

    <h2> Inserir Áudio </h2>
    <p> Seu Perfume - Nikmouu </p>
    <audio controls>
        <source src="sons/Nikmouu - Seu perfume  Diários de uma apotecária.mp3" type="audio/mpeg">
    </audio>

    <h2> Inserir Multimédia </h2>
    <p> Maomao, impressionada </p>
    <img src="img/anime-happiness.gif" />
</body>
